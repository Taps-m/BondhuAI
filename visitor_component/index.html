<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><title>Visitor counter</title></head>
<body style="margin:0">
<script>
const storageKey = "bondhu.visitor.id.v1";
let reported = false;
function send(type, extra = {}) {
    window.parent.postMessage({isStreamlitMessage: true, type, ...extra}, "*");
}
function getIdentity() {
    let identity = localStorage.getItem(storageKey);
    if (!/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(identity || "")) {
        identity = crypto.randomUUID();
        localStorage.setItem(storageKey, identity);
    }
    return identity;
}
window.addEventListener("message", async event => {
    if (event.source !== window.parent || event.data?.type !== "streamlit:render" || reported) return;
    reported = true;
    send("streamlit:setFrameHeight", {height: 0});
    try {
        // Coordinate first visits in concurrent tabs when Web Locks is available.
        const identity = navigator.locks
            ? await navigator.locks.request(storageKey, getIdentity)
            : getIdentity();
        send("streamlit:setComponentValue", {value: identity, dataType: "json"});
    } catch (_) {
        // Storage disabled: do not fabricate a new "unique" visitor on each refresh.
    }
});
send("streamlit:componentReady", {apiVersion: 1});
send("streamlit:setFrameHeight", {height: 0});
</script>
</body>
</html>
